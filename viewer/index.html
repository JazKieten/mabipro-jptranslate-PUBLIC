<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MabiScript Studio</title>
  <link rel="icon" href="/media/MSS_favicon.png" type="image/png" />
  <style>
    :root {
      --bg:          #e8e2d2;
      --surface:     #f0ebe0;
      --surface-hi:  #faf7f0;
      --border:      #c0cab0;
      --border-hi:   #78a060;
      --gold:        #9a7820;
      --gold-bright: #c09830;
      --gold-dim:    #c8b078;
      --text:        #1e2818;
      --text-dim:    #485e38;
      --text-muted:  #889878;
      --green:       #3a7028;
      --green-dim:   #cce8b8;
      --red-dim:     #f0e0e0;
      --hdr:         #1a3318;
      --hdr-border:  #2c4e28;
      --hdr-text:    #d8d0a0;
      --hdr-dim:     #6a8860;
      --hdr-muted:   #3a5838;
      --radius:      4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      min-height: 100vh;
      padding: 0 28px 100px;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       STICKY HEADER  (dark forest green)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--hdr);
      border-bottom: 2px solid var(--hdr-border);
      box-shadow: 0 4px 28px rgba(0,0,0,0.45);
      margin: 0 -28px;
      padding: 0 28px;
    }

    /* ── Single header row ── */
    #header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
    }
    #hdr-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #hdr-right {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    #branding-logo {
      height: 36px;
      width: auto;
      display: block;
      flex-shrink: 0;
    }
    .t-sep {
      width: 1px;
      height: 18px;
      background: var(--hdr-border);
      margin: 0 4px;
      flex-shrink: 0;
    }
    .tbtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #253e20;
      border: 1px solid #3a5830;
      color: #88a870;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 11px;
      padding: 5px 9px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: border-color .15s, color .15s, background .15s;
      user-select: none;
      white-space: nowrap;
    }
    .tbtn:hover { border-color: #5a8040; color: #a8c888; }
    #save-btn { border-color: #3a6828; color: #70b858; }
    #save-btn:hover { background: #2a5020; border-color: #58a040; color: #90d870; }
    #save-btn.lit  { background: #2a5020; border-color: #58a040; color: #90d870; }
    #unsaved {
      font-size: 11px;
      color: var(--hdr-muted);
      margin-left: 2px;
      transition: color .2s;
      cursor: default;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
      white-space: nowrap;
    }
    #unsaved.show {
      color: #80b860;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    #unsaved.show:hover { color: #a0d880; }

    /* ── Search ── */
    #search-row {
      display: flex;
      gap: 7px;
      flex: 0 1 360px;
      min-width: 0;
    }
    #line-input {
      flex: 1;
      min-width: 60px;
      background: #132a12;
      border: 1px solid #2a4828;
      color: #c8ddb8;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
      border-radius: var(--radius);
      transition: border-color .15s;
    }
    #line-input::placeholder { color: #3a5838; }
    #line-input:focus { border-color: #4a7840; }
    #search-btn {
      background: #253e20;
      border: 1px solid #2a4828;
      color: #78a068;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 12px;
      padding: 5px 9px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: border-color .15s, color .15s;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      min-width: 0;
    }
    #search-btn:hover { border-color: #5a8040; color: #a0c880; }

    /* ── Filter button in toolbar ── */
    #header.filter-open #sec-summary { background: #2a4820; border-color: #5a8040; color: #a0c880; }

    /* ── Responsive: hide logo + shrink search on narrow windows ── */
    @media (max-width: 500px) {
      #branding-logo { display: none; }
    }

    /* ── Section filter dropdown ── */
    #sec-body {
      display: none;
      border-top: 1px solid var(--hdr-border);
      padding: 6px 0 10px;
    }
    #header.filter-open #sec-body { display: block; }
    #sec-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 7px;
    }
    .sec-act {
      background: none; border: none;
      font-size: 0.65rem; color: var(--hdr-muted);
      cursor: pointer; text-decoration: underline;
      font-family: Tahoma, Arial, sans-serif;
    }
    .sec-act:hover { color: var(--hdr-dim); }
    #sec-boxes {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 14px;
    }
    .sec-lbl {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.65rem; color: var(--hdr-dim);
      cursor: pointer;
    }
    .sec-lbl input { accent-color: #78b858; cursor: pointer; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       DIALOG LIST  (parchment field)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #dialog-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: fit-content;
      margin: 26px auto 0;
    }

    .dlabel {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.03em;
      margin-bottom: 5px;
      padding: 14px 2px 0;
      border-top: 3px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mod-badge {
      font-size: 0.58rem;
      background: var(--green-dim);
      border: 1px solid #5a9830;
      color: #2a5818;
      padding: 1px 6px;
      border-radius: 2px;
      letter-spacing: 0.03em;
    }

    /* ── Tag chips (non-translatable tags shown above textarea) ── */
    .tag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      padding-bottom: 6px;
    }
    .tag-chip {
      font-size: 0.58rem;
      color: rgba(255,255,255,0.38);
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      cursor: default;
      white-space: nowrap;
    }
    .tag-chip:hover { color: rgba(255,255,255,0.65); border-color: rgba(255,255,255,0.2); }

    /* ── Translatable tag fields (button / inputbox / selectitem) ── */
    .tag-fields {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .tag-field-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }
    .tag-field-badge {
      font-size: 0.55rem;
      font-weight: bold;
      color: rgba(160,200,255,0.75);
      background: rgba(80,130,200,0.18);
      border: 1px solid rgba(100,150,220,0.28);
      border-radius: 3px;
      padding: 2px 5px;
      margin-top: 2px;
      flex-shrink: 0;
      font-family: monospace;
      letter-spacing: 0.04em;
    }
    .tag-field-inputs {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }
    .tag-field-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.3);
    }
    .tag-field-input {
      flex: 1;
      min-width: 0;
      background: rgba(0,0,0,0.2);
      border: 1px dashed rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.82);
      font-family: Tahoma, Arial, sans-serif;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 2px;
      outline: none;
      transition: border-color .15s;
    }
    .tag-field-input:focus { border-color: rgba(160,220,140,0.35); background: rgba(255,255,255,0.04); }
    .tag-field-input.mod { border-color: rgba(100,190,80,0.5); }
    .tag-field-meta {
      font-size: 0.58rem;
      color: rgba(255,255,255,0.22);
      font-family: monospace;
      padding: 2px 0;
      align-self: center;
    }

    /* ── Dialog box ── */
    .dbox {
      background-image: url('/media/textbox_bg.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      width: 1023px;
      min-height: 254px;
      padding: 22px 54px 50px 52px;
      position: relative;
      animation: fadeIn .18s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .dbox-name {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 6px;
      text-shadow:
        -3px -3px 0 #000, 0 -3px 0 #000, 3px -3px 0 #000,
        -3px  0   0 #000,               3px  0   0 #000,
        -3px  3px 0 #000, 0  3px 0 #000, 3px  3px 0 #000;
    }

    /* Edit-mode textarea */
    .dbox-ta {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px dashed rgba(255,255,255,0.12);
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.35;
      resize: none;
      outline: none;
      padding: 2px 3px;
      min-height: 2.8em;
      overflow: hidden;
      transition: border-color .15s, background .15s;
    }
    .dbox-ta:focus {
      border-color: rgba(180,220,140,0.35);
      background: rgba(255,255,255,0.03);
    }
    .dbox-ta.mod { border-color: rgba(100,190,80,0.5); }

    /* ── Pagination ── */
    .pag-bar {
      width: 1023px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 18px 0 6px;
    }
    .pag-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: Tahoma, Arial, sans-serif;
      font-size: 12px;
      padding: 5px 18px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: border-color .15s, color .15s, background .15s;
    }
    .pag-btn:hover:not(:disabled) { border-color: var(--border-hi); color: var(--text); background: var(--surface-hi); }
    .pag-btn:disabled { opacity: 0.3; cursor: default; }
    .pag-info {
      font-size: 0.72rem;
      color: var(--text-muted);
      min-width: 180px;
      text-align: center;
    }

    /* ── Status / empty state ── */
    #status {
      width: 1023px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 56px 0;
      line-height: 1.7;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       DIFF PANEL  (dark green, matches header)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #diff-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--hdr);
      border-top: 2px solid var(--hdr-border);
      max-height: 36vh;
      overflow-y: auto;
      z-index: 200;
      padding: 10px 28px 16px;
      transform: translateY(100%);
      transition: transform .22s ease;
    }
    #diff-panel.up { transform: translateY(0); }
    #diff-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--hdr-border);
    }
    #diff-title {
      font-size: 0.68rem;
      color: var(--hdr-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #diff-x {
      margin-left: auto;
      background: none;
      border: 1px solid var(--hdr-border);
      color: var(--hdr-muted);
      font-size: 11px;
      padding: 2px 9px;
      cursor: pointer;
      border-radius: var(--radius);
    }
    #diff-x:hover { border-color: #4a7040; color: var(--hdr-dim); }
    .diff-item {
      margin-bottom: 10px;
      padding-left: 10px;
      border-left: 2px solid #3a6030;
    }
    .diff-key { font-size: 0.6rem; color: var(--hdr-muted); margin-bottom: 4px; }
    .diff-row { display: flex; gap: 10px; font-size: 11px; margin-bottom: 2px; line-height: 1.5; }
    .diff-lbl { flex: 0 0 56px; font-size: 10px; color: var(--hdr-muted); }
    .diff-old { color: #c87878; }
    .diff-new { color: #80c870; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RELOAD TOAST
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #toast {
      position: fixed;
      top: 14px; right: 18px;
      background: #253e20;
      border: 1px solid #4a7840;
      color: #90d870;
      font-size: 0.68rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
      z-index: 9999;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <div id="hdr-left">
      <img src="/media/MSS_Logo.png" alt="MabiScript Studio" id="branding-logo" />
      <button id="save-btn" class="tbtn" title="Save all changes to npc.japan.txt"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,5 7,2 10,5"/><line x1="7" y1="2" x2="7" y2="10"/><line x1="2" y1="12" x2="12" y2="12"/></svg></button>
      <button id="unsaved">All saved</button>
    </div>
    <div id="hdr-right">
      <div id="search-row">
        <input id="line-input" type="text"
          placeholder="Line # (86), range (86–90), or search text…"
          autocomplete="off" spellcheck="false" />
        <button id="search-btn" title="Search"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5.5" cy="5.5" r="4"/><line x1="8.5" y1="8.5" x2="13" y2="13"/></svg></button>
      </div>
      <button id="sec-summary" class="tbtn" title="Filter by section" onclick="toggleSecFilter()"><svg width="13" height="13" viewBox="0 0 14 14" fill="currentColor"><path d="M1 2h12L9 7v5l-4-2V7z"/></svg></button>
    </div>
  </div>
  <div id="sec-body">
    <div id="sec-actions">
      <button class="sec-act" id="sel-all">Select all</button>
      <button class="sec-act" id="sel-none">Deselect all</button>
    </div>
    <div id="sec-boxes"></div>
  </div>
</div>

<div id="dialog-list">
  <div id="status">Enter a line number or search term above to begin.</div>
</div>

<div id="toast">&#x21BB;&ensp;File updated</div>

<div id="diff-panel">
  <div id="diff-bar">
    <span id="diff-title">Unsaved Changes</span>
    <button id="diff-x">&#x2715;&ensp;Close</button>
  </div>
  <div id="diff-content"></div>
</div>

<script>
  const USERNAME = 'Traveler';

  // ── State ──
  let allLines       = null;
  let allSections    = [];
  let activeSections = new Set();
  let currentPage    = 1;
  let lastQuery      = '';
  const PAGE_SIZE    = 100;

  const pendingEdits   = new Map();   // lineNum → Map<segIdx, newDisplay>
  const originalBodies = new Map();   // "ln-si" → { display, tagPositions, translatableTags, raw }

  // ── Utility ──
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function parseKey(raw) {
    const p = raw.split('.');
    const npcRaw = p[1] || '';
    return {
      section: (p[0] || '').toLowerCase(),
      npc: npcRaw ? npcRaw.charAt(0).toUpperCase() + npcRaw.slice(1) : 'NPC',
      raw
    };
  }

  // ── Tag handling ──
  const TAG_RE = () => /<\/?[a-zA-Z][^>]*\/?>/g;

  // <username/> and its common typos in the source file
  const USERNAME_RE = /^<(username|usermame|usernname|userneme|usernane|useranme|suername|sername)\s*\/>/i;
  const isUsernameTag    = tag => USERNAME_RE.test(tag);
  const isTranslatableTag = tag => /^<(button|inputbox|selectitem)[\s>\/]/i.test(tag);

  // Extract { attrName: value } pairs from a tag string
  function parseTagAttrs(tag) {
    const attrs = {};
    const re = /\b(\w+)=(['"])([^'"]*)\2/g;
    let m;
    while ((m = re.exec(tag)) !== null) attrs[m[1]] = m[3];
    return attrs;
  }

  // Replace one attribute value in a tag string, preserving surrounding structure
  function updateTagAttr(tag, attrName, newValue) {
    return tag.replace(
      new RegExp(`\\b(${attrName}=)(['"])([^'"]*)\\2`, 'i'),
      (_, attr, q) => attr + q + newValue + q
    );
  }

  // prepareForEdit — returns:
  //   display        : text with <br/>→\n, <username/>→[NAME], other tags removed
  //   tagPositions   : [{pos, tag}] — non-translatable tags at character positions in display
  //   translatableTags: [{tag, type, attrs}] — button/inputbox/selectitem tags
  function prepareForEdit(rawSeg) {
    const tagPositions    = [];
    const translatableTags = [];
    const parts = [];
    const re = TAG_RE();
    let last = 0, m, displayPos = 0;

    while ((m = re.exec(rawSeg)) !== null) {
      if (m.index > last) {
        const text = rawSeg.slice(last, m.index);
        parts.push(text);
        displayPos += text.length;
      }
      const tag = m[0];
      if (/^<br[\s/>]/i.test(tag)) {
        parts.push('\n');
        displayPos += 1;
      } else if (isUsernameTag(tag)) {
        parts.push('【NAME】');
        displayPos += 6;
      } else if (isTranslatableTag(tag)) {
        const type = tag.match(/^<([a-zA-Z]+)/)[1].toLowerCase();
        translatableTags.push({ tag, type, attrs: parseTagAttrs(tag) });
      } else {
        tagPositions.push({ pos: displayPos, tag });
      }
      last = re.lastIndex;
    }
    if (last < rawSeg.length) parts.push(rawSeg.slice(last));

    const display    = parts.join('');
    const adjustedPositions = tagPositions;

    return { display, tagPositions: adjustedPositions, translatableTags };
  }

  // reconstruct — reinserts positioned tags at their original character offsets,
  // converts [NAME]→<username/> and \n→<br/>, then appends translatable tags
  function reconstruct(display, tagPositions, translatableTags) {
    const sorted = [...(tagPositions || [])].sort((a, b) => a.pos - b.pos);
    let ti = 0, result = '';

    for (let i = 0; i <= display.length; i++) {
      while (ti < sorted.length && sorted[ti].pos === i) result += sorted[ti++].tag;
      if (i === display.length) break;
      if (display.slice(i, i + 6) === '【NAME】') { result += '<username/>'; i += 5; continue; }
      if (display[i] === '\n')                   { result += '<br/>';       continue; }
      result += display[i];
    }
    while (ti < sorted.length) result += sorted[ti++].tag;
    (translatableTags || []).forEach(tt => { result += tt.tag; });
    return result;
  }

  // Build read-only chip row for non-translatable positioned tags
  function buildChipRow(tagPositions) {
    if (!tagPositions || !tagPositions.length) return null;
    const row = document.createElement('div');
    row.className = 'tag-chips';
    tagPositions.forEach(({ tag }) => {
      const type  = (tag.match(/^<\/?([a-zA-Z]+)/) || [])[1]?.toLowerCase() || '?';
      const attrs = parseTagAttrs(tag);
      const nameMap = { face: 'face', npcportrait: 'portrait', title: 'title', image: 'img',
                        repair: 'repair', upgrade: 'upgrade', hotkey: 'key',
                        music: 'music', movie: 'movie', show: 'show', listbox: 'listbox' };
      const base  = nameMap[type] || type;
      const val   = attrs.name || attrs.item || null;
      const label = val && val !== 'NONE' ? `${base}: ${val}` : base;
      const chip  = document.createElement('span');
      chip.className = 'tag-chip';
      chip.title     = tag;
      chip.textContent = label;
      row.appendChild(chip);
    });
    return row;
  }

  // Build editable fields for button / inputbox / selectitem tags
  function buildTranslatableFields(translatableTags, onTagEdit) {
    if (!translatableTags || !translatableTags.length) return null;
    const wrap = document.createElement('div');
    wrap.className = 'tag-fields';
    translatableTags.forEach((tt, idx) => {
      const row   = document.createElement('div');
      row.className = 'tag-field-row';
      const badge = document.createElement('span');
      badge.className   = 'tag-field-badge';
      badge.textContent = tt.type === 'button' ? 'BTN' : tt.type === 'inputbox' ? 'INPUT' : 'SELECT';
      row.appendChild(badge);
      const fields = document.createElement('div');
      fields.className = 'tag-field-inputs';
      ['title', 'caption'].forEach(attr => {
        if (tt.attrs[attr] === undefined) return;
        const lbl = document.createElement('label');
        lbl.className = 'tag-field-label';
        lbl.textContent = attr + ':';
        const inp = document.createElement('input');
        inp.className        = 'tag-field-input';
        inp.type             = 'text';
        inp.value            = tt.attrs[attr];
        inp.dataset.tagIdx   = idx;
        inp.dataset.tagAttr  = attr;
        inp.addEventListener('input', onTagEdit);
        lbl.appendChild(inp);
        fields.appendChild(lbl);
      });
      if (tt.type === 'button' && tt.attrs.keyword) {
        const kw = document.createElement('span');
        kw.className   = 'tag-field-meta';
        kw.textContent = tt.attrs.keyword;
        fields.appendChild(kw);
      }
      row.appendChild(fields);
      wrap.appendChild(row);
    });
    return wrap;
  }

  // ── Section filter ──
  function rebuildSections() {
    const seen = new Set();
    allLines.forEach(line => {
      const t = line.indexOf('\t');
      if (t === -1) return;
      const sec = (line.slice(0, t).split('.')[0] || '').toLowerCase().trim();
      if (sec) seen.add(sec);
    });
    const newSecs = [...seen].sort();

    // Add new sections as active; preserve existing checked state
    newSecs.forEach(s => { if (!allSections.includes(s)) activeSections.add(s); });
    allSections = newSecs;
    renderSecBoxes();
  }

  function renderSecBoxes() {
    const wrap = document.getElementById('sec-boxes');
    wrap.innerHTML = '';
    allSections.forEach(sec => {
      const lbl = document.createElement('label');
      lbl.className = 'sec-lbl';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = activeSections.has(sec);
      cb.dataset.s = sec;
      cb.addEventListener('change', () => {
        if (cb.checked) activeSections.add(sec); else activeSections.delete(sec);
        rerun();
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(' ' + sec));
      wrap.appendChild(lbl);
    });
  }

  function toggleSecFilter() {
    document.getElementById('header').classList.toggle('filter-open');
  }

  // ── Auto-resize textarea ──
  function autoResize(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  // ── Build a single dialog box ──
  function buildBox(key, segBody, lineNum, segIdx, delay) {
    const info     = parseKey(key);
    const eid      = `${lineNum}-${segIdx}`;
    const prepared = prepareForEdit(segBody);

    originalBodies.set(eid, {
      display:          prepared.display,
      tagPositions:     prepared.tagPositions,
      translatableTags: prepared.translatableTags,
      raw:              segBody
    });

    const box = document.createElement('div');
    box.className = 'dbox';
    box.dataset.ln  = lineNum;
    box.dataset.si  = segIdx;
    box.dataset.key = key;
    box.style.animationDelay = `${delay}ms`;

    const nameEl = document.createElement('div');
    nameEl.className = 'dbox-name';
    nameEl.textContent = info.npc;
    box.appendChild(nameEl);

    // Non-translatable tag chips (above textarea)
    const chipRow = buildChipRow(prepared.tagPositions);
    if (chipRow) box.appendChild(chipRow);

    // Main editable textarea
    const ta = document.createElement('textarea');
    ta.className = 'dbox-ta';
    ta.value     = prepared.display;
    ta.addEventListener('input', () => { autoResize(ta); onEdit(ta, lineNum, segIdx, key); });
    box.appendChild(ta);
    requestAnimationFrame(() => autoResize(ta));

    // Translatable tag fields (below textarea)
    const tagFields = buildTranslatableFields(
      prepared.translatableTags,
      () => onEdit(ta, lineNum, segIdx, key, true)
    );
    if (tagFields) box.appendChild(tagFields);

    return box;
  }

  // ── Build entry: label + one box per <p/> segment ──
  function buildEntry(key, body, lineNum, delayOff) {
    const frag = document.createDocumentFragment();
    const segs = body.split(/<p\s*\/>/gi).map(s => s.trim())
      .filter(s => s && prepareForEdit(s).display.trim().length > 0);
    if (!segs.length) return frag;
    const lbl = document.createElement('div');
    lbl.className = 'dlabel';
    lbl.dataset.lf = lineNum;
    lbl.textContent = `#${lineNum}  ·  ${key}`;
    frag.appendChild(lbl);
    segs.forEach((seg, si) => frag.appendChild(buildBox(key, seg, lineNum, si, (delayOff + si) * 50)));
    return frag;
  }

  // ── Edit tracking ──
  function onEdit(ta, lineNum, segIdx, key, tagChanged = false) {
    const eid  = `${lineNum}-${segIdx}`;
    const orig = originalBodies.get(eid)?.display ?? '';
    const cur  = ta.value;
    const diff = cur !== orig || tagChanged;

    ta.classList.toggle('mod', diff);

    if (!pendingEdits.has(lineNum)) pendingEdits.set(lineNum, new Map());
    const segsMap = pendingEdits.get(lineNum);
    if (diff) segsMap.set(segIdx, cur);
    else {
      segsMap.delete(segIdx);
      if (!segsMap.size) pendingEdits.delete(lineNum);
    }

    // Label badge
    const lbl = document.querySelector(`.dlabel[data-lf="${lineNum}"]`);
    if (lbl) {
      const badge = lbl.querySelector('.mod-badge');
      if (pendingEdits.has(lineNum)) {
        if (!badge) { const b = document.createElement('span'); b.className = 'mod-badge'; b.textContent = 'modified'; lbl.appendChild(b); }
      } else {
        badge?.remove();
      }
    }

    refreshUnsaved();
  }

  function refreshUnsaved() {
    const n   = pendingEdits.size;
    const el  = document.getElementById('unsaved');
    const btn = document.getElementById('save-btn');
    if (n > 0) {
      el.textContent = `${n} unsaved line${n > 1 ? 's' : ''}`;
      el.classList.add('show');
      btn.classList.add('lit');
    } else {
      el.textContent = 'All saved';
      el.classList.remove('show');
      btn.classList.remove('lit');
    }
  }

  function refreshDiff() {
    const content = document.getElementById('diff-content');
    if (!pendingEdits.size) { closeDiffPanel(); return; }

    const entries = [];
    pendingEdits.forEach((segsMap, lineNum) => {
      segsMap.forEach((newText, segIdx) => {
        entries.push({ lineNum, segIdx, segsMap, newText });
      });
    });

    content.innerHTML = '';
    for (let i = entries.length - 1; i >= 0; i--) {
      const { lineNum, segIdx, segsMap, newText } = entries[i];
      const eid   = `${lineNum}-${segIdx}`;
      const orig  = originalBodies.get(eid)?.display ?? '';
      const boxEl = document.querySelector(`.dbox[data-ln="${lineNum}"][data-si="${segIdx}"]`);
      const key   = boxEl?.dataset.key ?? `line ${lineNum}`;

      const item = document.createElement('div');
      item.className = 'diff-item';
      item.innerHTML =
        `<div class="diff-key">#${lineNum}&ensp;·&ensp;${esc(key)}${segsMap.size > 1 ? `&ensp;·&ensp;seg ${segIdx}` : ''}</div>` +
        `<div class="diff-row"><span class="diff-lbl">Before:</span><span class="diff-old">${esc(orig) || '<em style="opacity:.4">empty</em>'}</span></div>` +
        `<div class="diff-row"><span class="diff-lbl">After:</span><span class="diff-new">${esc(newText) || '<em style="opacity:.4">empty</em>'}</span></div>`;
      content.appendChild(item);
    }
  }

  // ── Save ──
  async function saveAll() {
    if (!pendingEdits.size) return;
    const changes = [];

    pendingEdits.forEach((_, lineNum) => {
      const boxes = [...document.querySelectorAll(`.dbox[data-ln="${lineNum}"]`)]
        .sort((a,b) => Number(a.dataset.si) - Number(b.dataset.si));
      if (!boxes.length) return;

      const key  = boxes[0].dataset.key;
      const segs = [];

      boxes.forEach(bx => {
        const si = Number(bx.dataset.si);
        const ta = bx.querySelector('.dbox-ta');
        const ob = originalBodies.get(`${lineNum}-${si}`);
        const displayText = ta ? ta.value : (ob?.display ?? '');
        // Collect updated translatable tag values from the DOM inputs
        const updatedTags = (ob?.translatableTags || []).map((tt, idx) => {
          let updatedTag = tt.tag;
          bx.querySelectorAll(`.tag-field-input[data-tag-idx="${idx}"]`).forEach(inp => {
            updatedTag = updateTagAttr(updatedTag, inp.dataset.tagAttr, inp.value);
          });
          return { ...tt, tag: updatedTag };
        });
        segs[si] = reconstruct(displayText, ob?.tagPositions ?? [], updatedTags);
      });

      // Join segments with <p/> (regardless of current pSplitMode — always split was used for edit)
      const body = segs.join('<p/>');
      changes.push({ lineNumber: lineNum, rawLine: key + '\t' + body });
    });

    try {
      const res = await fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ changes })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      // Sync local state
      changes.forEach(({ lineNumber, rawLine }) => {
        allLines[lineNumber - 1] = rawLine;
        const t    = rawLine.indexOf('\t');
        const body = t === -1 ? '' : rawLine.slice(t + 1);
        const segs = body.split(/<p\s*\/>/gi).map(s => s.trim()).filter(Boolean);
        segs.forEach((seg, si) => {
          const pr = prepareForEdit(seg);
          originalBodies.set(`${lineNumber}-${si}`, {
            display:          pr.display,
            tagPositions:     pr.tagPositions,
            translatableTags: pr.translatableTags,
            raw:              seg
          });
        });
      });

      pendingEdits.clear();
      document.querySelectorAll('.dbox-ta.mod').forEach(ta => ta.classList.remove('mod'));
      document.querySelectorAll('.mod-badge').forEach(b => b.remove());
      refreshUnsaved();
      refreshDiff();
      flashToast();
    } catch (e) {
      alert('Save failed: ' + e.message);
    }
  }

  // ── Fetch ──
  async function fetchLines() {
    try {
      const res = await fetch('/dialog.txt?t=' + Date.now());
      if (!res.ok) throw new Error();
      allLines = (await res.text()).split('\n');
      rebuildSections();
      return true;
    } catch {
      setStatus('&#9888;&ensp;Could not load npc.japan.txt');
      return false;
    }
  }

  function setStatus(html) {
    document.getElementById('dialog-list').innerHTML = `<div id="status">${html}</div>`;
  }

  // ── Main render ──
  function showLines(query) {
    try {
      _showLines(query);
    } catch (e) {
      console.error('showLines error:', e);
      setStatus('&#9888;&ensp;Render error — see console for details.');
    }
  }

  function _showLines(query) {
    if (!allLines) { setStatus('&#9888;&ensp;File not loaded yet.'); return; }

    const container = document.getElementById('dialog-list');
    container.innerHTML = '';
    const q = query.trim();

    let entries = [];

    function secOk(key) {
      if (!activeSections.size) return true;
      return activeSections.has((key.split('.')[0] || '').toLowerCase());
    }

    if (/^\d+-\d+$/.test(q)) {
      let [a, b] = q.split('-').map(Number);
      if (a > b) [a, b] = [b, a];
      for (let n = a; n <= b; n++) {
        const line = allLines[n - 1];
        if (!line && line !== '') { setStatus(`Line ${n} is out of range (file has ${allLines.length} lines).`); return; }
        const t = line.indexOf('\t');
        if (t === -1) continue;
        const key = line.slice(0, t).trim();
        if (!secOk(key)) continue;
        entries.push({ n, key, body: line.slice(t + 1).trim() });
      }
    } else if (/^\d+$/.test(q)) {
      const n    = Number(q);
      const line = allLines[n - 1];
      if (!line && line !== '') { setStatus(`Line ${n} is out of range.`); return; }
      const t = line ? line.indexOf('\t') : -1;
      if (t !== -1) {
        const key = line.slice(0, t).trim();
        if (secOk(key)) entries.push({ n, key, body: line.slice(t + 1).trim() });
      }
    } else {
      // Exact substring search (case-insensitive), tags stripped from body before matching
      const ql = q.toLowerCase();
      for (let i = 0; i < allLines.length; i++) {
        const line = allLines[i];
        const t    = line.indexOf('\t');
        if (t === -1) continue;
        const key      = line.slice(0, t).trim();
        const body     = line.slice(t + 1).trim();
        if (!secOk(key)) continue;
        const bodyText = body.replace(/<[^>]+>/g, '');
        if (!(key + ' ' + bodyText).toLowerCase().includes(ql)) continue;
        entries.push({ n: i + 1, key, body });
      }
    }

    if (!entries.length) {
      setStatus(`No dialog found for &ldquo;<b>${esc(q)}</b>&rdquo;.`);
      return;
    }

    // Reset to page 1 whenever the query changes
    if (q !== lastQuery) { currentPage = 1; lastQuery = q; }
    const totalPages = Math.ceil(entries.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = totalPages;

    const pageEntries = entries.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    if (totalPages > 1) container.appendChild(buildPagination(totalPages, entries.length, q));
    pageEntries.forEach(({ n, key, body }, i) => container.appendChild(buildEntry(key, body, n, i)));
    if (totalPages > 1) container.appendChild(buildPagination(totalPages, entries.length, q));
  }

  function buildPagination(totalPages, total, q) {
    const bar = document.createElement('div');
    bar.className = 'pag-bar';

    const prev = document.createElement('button');
    prev.className = 'pag-btn';
    prev.textContent = '← Prev';
    prev.disabled = currentPage <= 1;
    prev.addEventListener('click', () => { currentPage--; showLines(q); });

    const info = document.createElement('span');
    info.className = 'pag-info';
    info.textContent = `Page ${currentPage} of ${totalPages}  ·  ${total} results`;

    const next = document.createElement('button');
    next.className = 'pag-btn';
    next.textContent = 'Next →';
    next.disabled = currentPage >= totalPages;
    next.addEventListener('click', () => { currentPage++; showLines(q); });

    bar.appendChild(prev);
    bar.appendChild(info);
    bar.appendChild(next);
    return bar;
  }

  // ── UI helpers ──
  function rerun() {
    const q = document.getElementById('line-input').value.trim();
    if (q) showLines(q);
  }

  function flashToast() {
    const el = document.getElementById('toast');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1400);
  }

  // ── Controls ──
  document.getElementById('search-btn').addEventListener('click', () => { currentPage = 1; showLines(document.getElementById('line-input').value); });
  document.getElementById('line-input').addEventListener('keydown', e => { if (e.key === 'Enter') { currentPage = 1; showLines(e.target.value); } });

  document.getElementById('save-btn').addEventListener('click', saveAll);

  // ── Diff panel open / close / click-outside ──
  let _diffOutsideActive = false;
  function openDiffPanel() {
    document.getElementById('diff-panel').classList.add('up');
    if (_diffOutsideActive) return;
    _diffOutsideActive = true;
    setTimeout(() => {
      function onOut(e) {
        const panel = document.getElementById('diff-panel');
        const btn   = document.getElementById('unsaved');
        if (!panel.contains(e.target) && !btn.contains(e.target)) {
          panel.classList.remove('up');
          document.removeEventListener('click', onOut);
          _diffOutsideActive = false;
        }
      }
      document.addEventListener('click', onOut);
    }, 0);
  }
  function closeDiffPanel() {
    document.getElementById('diff-panel').classList.remove('up');
  }
  document.getElementById('unsaved').addEventListener('click', () => { refreshDiff(); openDiffPanel(); });
  document.getElementById('diff-x').addEventListener('click', closeDiffPanel);


  document.getElementById('sel-all').addEventListener('click', () => {
    activeSections = new Set(allSections);
    document.querySelectorAll('#sec-boxes input').forEach(cb => cb.checked = true);
    rerun();
  });
  document.getElementById('sel-none').addEventListener('click', () => {
    activeSections = new Set();
    document.querySelectorAll('#sec-boxes input').forEach(cb => cb.checked = false);
    rerun();
  });

  // ── SSE (auto-reconnects on its own — do NOT close it in onerror) ──
  const evtSource = new EventSource('/events');
  evtSource.onmessage = async e => {
    if (e.data !== 'reload') return;
    await fetchLines();
    rerun();
    flashToast();
  };
  // onerror fires on disconnect but EventSource will reconnect automatically —
  // just ignore it so we don't accidentally break the connection.
  evtSource.onerror = () => {};

  fetchLines();
</script>
</body>
</html>
